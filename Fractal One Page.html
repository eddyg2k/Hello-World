<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Synctellect 808 Respeto Vivo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'JetBrains Mono', monospace; cursor: crosshair; }
        #hud { position: absolute; z-index: 100; pointer-events: none; user-select: none; width: 100%; height: 100%; }
        .hud-tl { position: absolute; top: 24px; left: 24px; color: #00f0ff; }
        .hud-tl h1 { font-size: 0.7rem; font-weight: 300; letter-spacing: 4px; opacity: 0.6; }
        .hud-tl .oi { font-size: 2.2rem; font-weight: 700; margin-top: 4px; line-height: 1; text-shadow: 0 0 20px currentColor; }
        .hud-tl .ol { font-size: 0.6rem; font-weight: 300; letter-spacing: 2px; opacity: 0.4; margin-top: 4px; }
        .hud-tr { position: absolute; top: 24px; right: 24px; color: rgba(255,255,255,0.15); font-size: 0.55rem; text-align: right; letter-spacing: 1px; line-height: 1.8; }
        .hud-bc { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); text-align: center; color: rgba(255,255,255,0.2); font-size: 0.55rem; letter-spacing: 2px; }
        #reticle { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; z-index: 101; }
        #reticle::before, #reticle::after { content: ''; position: absolute; background: rgba(0,240,255,0.3); }
        #reticle::before { width: 1px; height: 100%; left: 50%; }
        #reticle::after { width: 100%; height: 1px; top: 50%; }
        .wm { position: absolute; bottom: 60px; left: 24px; font-size: 0.4rem; letter-spacing: 3px; color: rgba(255,255,255,0.03); z-index: 200; pointer-events: none; user-select: none; text-transform: uppercase; }
        #warp-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #00f0ff; opacity: 0; z-index: 50; pointer-events: none; transition: opacity 0.15s ease-out; }
    </style>
</head>
<body>
    <div id="warp-flash"></div>
    <div id="hud">
        <div class="hud-tl">
            <h1>SYNCTELLECT</h1>
            <div class="oi" id="ho">3</div>
            <div class="ol" id="hl">STRATEGIC</div>
        </div>
        <div class="hud-tr">
            CAM R: <span id="hr">0</span><br>
            ORBIT: <span id="hob">0</span>/5<br>
            FPS: <span id="hf">0</span>
        </div>
        <div class="hud-bc">
            L-DRAG ORBIT • R-DRAG PAN • SCROLL WARP SUAVE • WASD FLY • SPACE BOOST
        </div>
    </div>
    <div id="reticle"></div>
    <div class="wm">ARCHITECT: EDUARDO GUZMÁN / 808 RESPETO VIVO / FAIC</div>

    <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
    </script>
    <script type="module">
        import * as THREE from 'three';

        const ORBITS = [
            { r: 0, label: 'COMMAND CENTER', color: 0x00f0ff, shellColor: 0x00f0ff },
            { r: 200, label: 'CORE SYSTEMS', color: 0xff00aa, shellColor: 0xff00aa },
            { r: 500, label: 'ACTIVE OPS', color: 0x00ffcc, shellColor: 0x00ffcc },
            { r: 1000, label: 'STRATEGIC', color: 0xffffff, shellColor: 0xffffff },
            { r: 2000, label: 'PERIPHERAL', color: 0x8800ff, shellColor: 0x8800ff },
            { r: 4000, label: 'BUFFER ZONE', color: 0x00aaff, shellColor: 0x00aaff }
        ];
        const VOID_R = 6000;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000011, 0.00018);
        const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 80000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const starGeo = new THREE.BufferGeometry();
        const starCount = 6000;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 50000;
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 2, transparent: true, opacity: 0.5 }));
        scene.add(stars);

        const shells = [];
        for (let o = 1; o < ORBITS.length; o++) {
            const orbit = ORBITS[o];
            const geo = new THREE.IcosahedronGeometry(orbit.r, 2);
            const mat = new THREE.MeshBasicMaterial({ color: orbit.shellColor, wireframe: true, transparent: true, opacity: 0.06, side: THREE.DoubleSide });
            const mesh = new THREE.Mesh(geo, mat);
            scene.add(mesh);
            shells.push({ mesh, orbit: o, baseOpacity: 0.06 });
        }
        scene.add(new THREE.Mesh(new THREE.IcosahedronGeometry(VOID_R, 1), new THREE.MeshBasicMaterial({ color: 0x00aaff, wireframe: true, transparent: true, opacity: 0.03, side: THREE.DoubleSide })));

        const nodes = [];
        for (let o = 1; o < ORBITS.length; o++) {
            const orbit = ORBITS[o];
            const theta = o * 1.2;
            const phi = 0.5 + o * 0.4;
            const pos = new THREE.Vector3(orbit.r * Math.sin(phi) * Math.cos(theta), orbit.r * Math.cos(phi), orbit.r * Math.sin(phi) * Math.sin(theta));
            const core = new THREE.Mesh(new THREE.SphereGeometry(orbit.r * 0.02, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            core.position.copy(pos);
            const glow = new THREE.Mesh(new THREE.SphereGeometry(orbit.r * 0.08, 32, 32), new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.4 }));
            core.add(glow);
            scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), pos]), new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.04 })));
            scene.add(core);
            nodes.push({ mesh: core, orbit: o, r: orbit.r, theta, phi, speed: 0.0002 * (o % 2 === 0 ? 1 : -1) });
        }

        const voidTorus = new THREE.Mesh(new THREE.TorusGeometry(30, 10, 24, 64), new THREE.MeshBasicMaterial({ color: 0x001122, wireframe: true, transparent: true, opacity: 0.7 }));
        scene.add(voidTorus);

        const blackHole = new THREE.Mesh(new THREE.SphereGeometry(15, 24, 24), new THREE.MeshBasicMaterial({ color: 0x000000 }));
        scene.add(blackHole);

        const cam = { r: 3000, theta: 0, phi: Math.PI / 2, vr: 0, vTheta: 0, vPhi: 0 };
        const friction = { angular: 0.92, radial: 0.95 };
        function toCartesian(r, theta, phi) {
            return new THREE.Vector3(r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
        }
        function getOrbit(r) {
            if (r >= VOID_R) return 6;
            for (let i = ORBITS.length - 1; i >= 0; i--) if (r >= ORBITS[i].r) return i;
            return 0;
        }

        const input = { drag: false, rdrag: false, lx: 0, ly: 0, keys: {}, boost: false };
        addEventListener('contextmenu', e => e.preventDefault());
        addEventListener('pointerdown', e => {
            if (e.button === 0) input.drag = true;
            if (e.button === 2) input.rdrag = true;
            input.lx = e.clientX; input.ly = e.clientY;
        });
        addEventListener('pointermove', e => {
            const dx = e.clientX - input.lx, dy = e.clientY - input.ly;
            input.lx = e.clientX; input.ly = e.clientY;
            if (input.drag) { cam.vTheta += dx * 0.003; cam.vPhi -= dy * 0.003; }
            if (input.rdrag) { cam.theta += dx * 0.002; cam.phi = Math.max(0.1, Math.min(Math.PI - 0.1, cam.phi - dy * 0.002)); }
        });
        addEventListener('pointerup', e => {
            if (e.button === 0) input.drag = false;
            if (e.button === 2) input.rdrag = false;
        });
        addEventListener('wheel', e => {
            e.preventDefault();
            const speed = Math.max(5, Math.abs(cam.r * 0.04)) * 0.5; // BAJADO 50%
            cam.vr += (e.deltaY > 0 ? 1 : -1) * speed * 0.3;
        }, { passive: false });
        addEventListener('keydown', e => { input.keys[e.code] = true; if (e.code === 'Space') input.boost = true; });
        addEventListener('keyup', e => { input.keys[e.code] = false; if (e.code === 'Space') input.boost = false; });

        let touchDist = 0;
        addEventListener('touchstart', e => {
            if (e.touches.length === 2) touchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            else { input.drag = true; input.lx = e.touches[0].clientX; input.ly = e.touches[0].clientY; }
        }, { passive: false });
        addEventListener('touchmove', e => {
            e.preventDefault();
            if (e.touches.length === 2) {
                const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const speed = Math.max(5, Math.abs(cam.r * 0.04)) * 0.5; // BAJADO 50%
                cam.vr += (touchDist - d) * speed * 0.01;
                touchDist = d;
            } else if (input.drag) {
                const dx = e.touches[0].clientX - input.lx, dy = e.touches[0].clientY - input.ly;
                input.lx = e.touches[0].clientX; input.ly = e.touches[0].clientY;
                cam.vTheta += dx * 0.003; cam.vPhi -= dy * 0.003;
            }
        }, { passive: false });
        addEventListener('touchend', () => input.drag = false);

        const warpFlash = document.getElementById('warp-flash');
        let lastOrbit = getOrbit(cam.r);
        function triggerWarp() {
            warpFlash.style.opacity = '0.3';
            setTimeout(() => warpFlash.style.opacity = '0', 150);
        }

        // 808 VIVO - REGRESADO CON PUNCH
        const bassOsc = { phase: 0, freq: 8 }; // rápido pero vivo
        const raveColors = [0x00f0ff, 0xff00aa, 0xffffff, 0x00aaff];
        let raveIndex = 0;

        const clock = new THREE.Clock();
        let fc = 0, ft = 0, fps = 0;

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            fc++; ft += dt; if (ft >= 0.5) { fps = Math.round(fc / ft); fc = 0; ft = 0; }

            const boost = input.boost ? 3 : 1;
            if (input.keys.KeyW) cam.vr -= (2 + cam.r * 0.003) * boost;
            if (input.keys.KeyS) cam.vr += (2 + cam.r * 0.003) * boost;
            if (input.keys.KeyA) cam.vTheta -= 0.02;
            if (input.keys.KeyD) cam.vTheta += 0.02;

            cam.theta += cam.vTheta;
            cam.phi += cam.vPhi;
            cam.r += cam.vr;
            cam.phi = Math.max(0.1, Math.min(Math.PI - 0.1, cam.phi));
            cam.r = Math.max(1, cam.r);
            cam.vTheta *= friction.angular;
            cam.vPhi *= friction.angular;
            cam.vr *= friction.radial;

            camera.position.copy(toCartesian(cam.r, cam.theta, cam.phi));
            camera.lookAt(0, 0, 0);

            const currentOrbit = getOrbit(cam.r);
            if (currentOrbit !== lastOrbit) { triggerWarp(); lastOrbit = currentOrbit; }

            for (const node of nodes) {
                node.theta += node.speed;
                node.mesh.position.copy(toCartesian(node.r, node.theta, node.phi));
                node.mesh.children[0].material.opacity = 0.4 + Math.sin(clock.getElapsedTime() * 4 + node.orbit) * 0.2;
            }

            voidTorus.rotation.x += 0.004;
            voidTorus.rotation.y += 0.006;
            voidTorus.rotation.z += 0.002;
            voidTorus.scale.setScalar(1 + Math.sin(clock.getElapsedTime() * 4) * 0.2);

            for (const s of shells) {
                s.mesh.rotation.y += 0.0003;
                s.mesh.rotation.z += 0.0001;
                s.mesh.material.opacity = s.baseOpacity + Math.sin(clock.getElapsedTime() * 3) * 0.04;
            }

            stars.rotation.z += 0.0001;

            // 808 CON VIDA
            bassOsc.phase += dt * bassOsc.freq;
            const rawSin = Math.sin(bassOsc.phase);
            const bassPulse = (rawSin > 0 ? rawSin : 0) ** 1.6;

            voidTorus.scale.setScalar(1 + bassPulse * 0.7);
            voidTorus.material.color.setHex(0x001122 + Math.floor(bassPulse * 0x002200));

            if (bassPulse > 0.6) {
                if (Math.random() < 0.2) raveIndex = Math.floor(Math.random() * raveColors.length);
            }

            for (const node of nodes) {
                node.mesh.children[0].material.color.setHex(raveColors[raveIndex]);
                node.mesh.children[0].material.opacity = 0.4 + bassPulse * 0.4;
            }

            for (const s of shells) s.mesh.material.opacity = s.baseOpacity + bassPulse * 0.08;

            stars.material.opacity = 0.5 + bassPulse * 0.2;

            renderer.render(scene, camera);

            const od = currentOrbit < ORBITS.length ? ORBITS[currentOrbit] : { label: 'THE VOID', color: 0x00aaff };
            document.getElementById('ho').textContent = currentOrbit >= 6 ? '∞' : currentOrbit;
            document.getElementById('ho').style.color = '#' + od.color.toString(16).padStart(6, '0');
            document.getElementById('hl').textContent = od.label;
            document.getElementById('hr').textContent = Math.round(cam.r);
            document.getElementById('hob').textContent = currentOrbit;
            document.getElementById('hf').textContent = fps;
        }

        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        console.log('%c 808 RESPETO VIVO - SIN JODER NADA MI REY ', 'background:#ff00aa;color:#000;font-weight:bold;padding:12px 20px;');
        animate();
    </script>
</body>
</html>
